name = "example_chat"
version = "0.1.0"
description = "A minimal chat app with channels, threads and reactions, used to demonstrate EYG cloud channel plugins."

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"
gleam_http = ">= 4.5.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
howdy = ">= 1.0.1 and < 2.0.0"
howdy_ui = ">= 1.0.0 and < 2.0.0"
lustre = ">= 5.7.1 and < 6.0.0"
simplifile = ">= 2.4.0 and < 3.0.0"
envoy = ">= 1.2.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
