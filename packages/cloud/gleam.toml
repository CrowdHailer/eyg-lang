name = "cloud"
version = "0.1.0"
target = "erlang"
description = "A local, browser based EYG shell with a versioned in-memory file system."
licences = ["Apache-2.0"]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_crypto = ">= 1.5.1 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_time = ">= 1.8.0 and < 2.0.0"
etui = ">= 2.0.0 and < 3.0.0"
eyg_analysis = ">= 3.1.0 and < 4.0.0"
eyg_interpreter = ">= 9.0.0 and < 10.0.0"
eyg_ir = ">= 3.0.0 and < 4.0.0"
eyg_parser = ">= 0.6.0 and < 1.0.0"
howdy = ">= 1.0.0 and < 2.0.0"
howdy_ui = ">= 1.0.0 and < 2.0.0"
lustre = ">= 5.7.0 and < 6.0.0"
multiformats = ">= 4.0.0 and < 5.0.0"
simplifile = ">= 2.7.0 and < 3.0.0"
morph = { path = "../morph" }
touch_grass = { path = "../touch_grass" }
unixfs = { path = "../unixfs" }

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
