name: eyg-cloud

services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  s3:
    image: docker.io/chrislusf/seaweedfs:4.55
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env.local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env.local}
      AWS_DEFAULT_REGION: ${S3_REGION:?Set S3_REGION in .env.local}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env.local}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - s3-data:/data

volumes:
  postgres-data:
  s3-data:
