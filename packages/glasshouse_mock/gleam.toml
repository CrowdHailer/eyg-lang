name = "glasshouse_mock"
version = "0.1.0"
target = "javascript"

description = "Development mocks for Langfuse, an Ollama model and Neon, to run Glasshouse without accounts."

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
eyg_ir = { path = "../gleam_ir" }
eyg_analysis = { path = "../gleam_analysis" }
eyg_parser = { path = "../gleam_parser" }
plinthx = { path = "../plinthx" }
otel = { path = "../otel" }
javascript_mutable_reference = ">= 1.0.0 and < 2.0.0"
envoy = ">= 1.2.0 and < 2.0.0"
glasshouse = { path = "../glasshouse" }
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_time = ">= 1.8.0 and < 2.0.0"
simplifile = ">= 2.7.0 and < 3.0.0"

[dev_dependencies]
ogre = ">= 1.1.0 and < 2.0.0"
eyg_cli = { path = "../gleam_cli" }
gleeunit = ">= 1.0.0 and < 2.0.0"
gleam_crypto = ">= 1.6.0 and < 2.0.0"
loam = { path = "../loam" }
oas_generator_utils = ">= 1.1.0 and < 2.0.0"
overlay_llm = { path = "../overlay_llm" }
touch_grass = { path = "../touch_grass" }

[javascript]
runtime = "bun"
