name = "tracing"
version = "0.1.0"
target = "javascript"
description = "Gleam checks and recordings of EYG tools"

[dependencies]
argv = ">= 1.0.2 and < 2.0.0"
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_playwright = { path = "../gleam_playwright" }
gleam_crypto = ">= 1.6.0 and < 2.0.0"
ogre = ">= 1.3.0 and < 2.0.0"
javascript_mutable_reference = ">= 1.0.0 and < 2.0.0"
loam = { path = "../loam" }
eyg_hub = { path = "../gleam_hub" }
eyg_ir = { path = "../gleam_ir" }
eyg_interpreter = { path = "../gleam_interpreter" }
glasshouse = { path = "../glasshouse" }
otel = { path = "../otel" }
plinthx = { path = "../plinthx" }
multiformats = ">= 4.0.0 and < 5.0.0"
midas = ">= 3.1.0 and < 4.0.0"
untethered = { path = "../untethered" }
shellout = ">= 1.8.0 and < 2.0.0"
simplifile = ">= 2.7.0 and < 3.0.0"
filepath = ">= 1.1.2 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"

[javascript]
runtime = "bun"
