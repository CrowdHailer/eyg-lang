services:
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0
    command: ["--config", "/etc/jaeger/config.yaml"]
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./jaeger.yaml:/etc/jaeger/config.yaml:ro
      - traces:/tmp

volumes:
  traces:
