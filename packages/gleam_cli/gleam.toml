name = "eyg_cli"
version = "0.1.0"
target = "javascript"

description = "CLI for running EYG programs and interacting with the EYG hub."
licences = ["Apache-2.0"]
repository = { type = "github", user = "crowdhailer", repo = "eyg-lang", path = "packages/gleam_cli", tag_prefix = "gleam_cli-" }
links = [{ title = "Website", href = "https://eyg.run" }]

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
argv = ">= 1.0.2 and < 2.0.0"
etui = ">= 2.0.0 and < 3.0.0"
eyg_analysis = { path = "../gleam_analysis" }
eyg_compiler = { path = "../gleam_compiler" }
eyg_hub = { path = "../gleam_hub" }
eyg_interpreter = { path = "../gleam_interpreter" }
eyg_ir = { path = "../gleam_ir" }
eyg_parser = { path = "../gleam_parser" }
filepath = ">= 1.1.2 and < 2.0.0"
glasshouse = { path = "../glasshouse" }
gleam_crypto = ">= 1.5.1 and < 2.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
gleam_x = { path = "../gleam_x" }
javascript_mutable_reference = ">= 1.0.0 and < 2.0.0"
gleam_time = ">= 1.8.0 and < 2.0.0"
kryptos = ">= 1.3.0 and < 2.0.0"
loam = { path = "../loam" }
midas = ">= 3.0.0 and < 4.0.0"
morph = { path = "../morph" }
multiformats = ">= 4.0.0 and < 5.0.0"
ogre = ">= 1.1.0 and < 2.0.0"
oas_generator_utils = ">= 1.1.0 and < 2.0.0"
overlay = { path = "../overlay" }
overlay_llm = { path = "../overlay_llm" }
otel = { path = "../otel" }
plinthx = { path = "../plinthx" }
simplifile = ">= 2.4.0 and < 3.0.0"
touch_grass = { path = "../touch_grass" }
untethered = { path = "../untethered" }
gleam_community_ansi = ">= 1.5.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
birdie = ">= 2.0.0 and < 3.0.0"

[javascript]
runtime = "bun"
