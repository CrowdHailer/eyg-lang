name = "example_tools"
version = "0.1.0"
target = "javascript"
description = "Gleam build and development server for browser embedding examples."

[javascript]
runtime = "bun"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
plinthx = { path = "../plinthx" }
simplifile = ">= 2.7.0 and < 3.0.0"
filepath = ">= 1.1.2 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
gleam_fetch = ">= 1.4.0 and < 2.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
javascript_mutable_reference = ">= 1.0.0 and < 2.0.0"
