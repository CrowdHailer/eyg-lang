name = "eyg_tui"
version = "0.1.0"
target = "erlang"
description = "Main's structural EYG terminal shell on the BEAM"
[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
argv = ">= 1.0.2 and < 2.0.0"
envoy = ">= 1.1.0 and < 2.0.0"
eyg_cli = { path = "../gleam_cli" }
loam = { path = "../loam" }
midas = ">= 3.1.0 and < 4.0.0"
simplifile = ">= 2.7.0 and < 3.0.0"
etui = ">= 2.0.0 and < 3.0.0"
eyg_hub = { path = "../gleam_hub" }
ogre = ">= 1.3.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
eyg_parser = { path = "../gleam_parser" }
morph = { path = "../morph" }
gleam_crypto = ">= 1.6.0 and < 2.0.0"
