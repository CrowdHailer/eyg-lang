name = "eyg_embed"
version = "0.1.0"
target = "javascript"

description = "Shared host loop and typed scripting sessions for EYG on JavaScript."
licences = ["Apache-2.0"]
repository = { type = "github", user = "crowdhailer", repo = "eyg-lang", path = "packages/gleam_embed", tag_prefix = "gleam_embed-" }
links = [{ title = "Website", href = "https://eyg.run" }]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
eyg_analysis = { path = "../gleam_analysis" }
eyg_interpreter = { path = "../gleam_interpreter" }
eyg_ir = { path = "../gleam_ir" }
eyg_parser = { path = "../gleam_parser" }
gleam_javascript = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
gleam_fetch = ">= 1.4.0 and < 2.0.0"
midas = ">= 3.0.0 and < 4.0.0"
plinth = ">= 0.10.2 and < 1.0.0"

castor = ">= 2.1.0 and < 3.0.0"
oas_generator_utils = ">= 1.1.0 and < 2.0.0"
overlay_llm = { path = "../overlay_llm" }

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
plinthx = { path = "../plinthx" }
