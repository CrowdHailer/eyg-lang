name = "eyg_compiled_runtime"
version = "0.1.0"
target = "javascript"
description = "Gleam continuation machine embedded in compiled JavaScript"

[javascript]
runtime = "bun"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_javascript = ">= 1.0.1 and < 2.0.0"
javascript_mutable_reference = ">= 1.0.0 and < 2.0.0"
plinthx = { path = "../plinthx" }

[dev_dependencies]
argv = ">= 1.0.2 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleeunit = ">= 1.0.0 and < 2.0.0"
simplifile = ">= 2.7.0 and < 3.0.0"
