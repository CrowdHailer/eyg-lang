load_module modules/ngx_http_js_module.so;

error_log /dev/stderr info;

events {}

http {
  # QuickJS runs the compiled handler as it is, the njs engine rejects object spread.
  js_engine qjs;
  js_path /etc/nginx/njs;
  js_import main from handler.js;

  server {
    listen 8080;

    location / {
      js_content main.handle;
    }

    location = /upstream {
      return 200 "a plain nginx location";
    }
  }
}
