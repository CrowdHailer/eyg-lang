name: test

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  POSTGRES_PASSWORD: banana-penguin-truck
  SECRET_KEY_BASE: word-button-noodle
  HEXPM_READ_API_KEY: ${{ secrets.HEXPM_READ_API_KEY }}

jobs:
  test-beam:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gleam: ["1.19.2"]
        otp: ["28.4"]
        rebar3: ["3.25"]
        package: [
          "eyg_tui",
          "gleam_analysis",
          # "gleam_cli",
          # "gleam_compiler",
          "gleam_hub",
          "gleam_interpreter",
          "gleam_ir",
          "gleam_parser",
          "gleam_sha256",
          "html_parser",
          "intelligence",
          # "gleam_x",
          # "morph",
          overlay_llm,
          "topological",
          "touch_grass",
          "untethered"
          # "website"
        ]
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          gleam-version: ${{matrix.gleam}}
          rebar3-version: ${{matrix.rebar3}}
      - run: gleam deps download
        shell: bash # Required for git deps
        working-directory: packages/${{matrix.package}}
      - name: Manifest is in sync
        # `gleam deps download` regenerates manifest.toml when its
        # contents drift from gleam.toml. A non-empty diff means the
        # committed manifest was stale.
        run: git diff --exit-code manifest.toml
        working-directory: packages/${{matrix.package}}
      - run: gleam build --target erlang --warnings-as-errors
        working-directory: packages/${{matrix.package}}
      - run: gleam test --target erlang
        working-directory: packages/${{matrix.package}}
      - run: gleam format --check src test
        working-directory: packages/${{matrix.package}}
  test-db:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gleam: ["1.19.2"]
        otp: ["28.4"]
        rebar3: ["3.25"]
    services:
      postgres:
        image: postgres:17
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          gleam-version: ${{matrix.gleam}}
          rebar3-version: ${{matrix.rebar3}}
      - run: gleam build --warnings-as-errors
        working-directory: packages/hub
      - run: gleam run -m hub_dev -- migrate
        working-directory: packages/hub
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          SECRET_KEY_BASE: ${{ env.SECRET_KEY_BASE }}
      - run: gleam test
        working-directory: packages/hub
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          SECRET_KEY_BASE: ${{ env.SECRET_KEY_BASE }}
  test-bun:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4 # Cap repeated path-dependency resolution against Hex.
      matrix:
        gleam: ["1.19.2"]
        otp: ["28.4"]
        bun: ["1.3.13"]
        node: ["24.15.0"]
        path: [
          "packages/embed_js",
          "packages/example_tools",
          "packages/eyg_pi",
          "packages/glasshouse",
          "packages/glasshouse_mock",
          "packages/gleam_analysis",
          "packages/gleam_cli",
          "packages/gleam_compiled_runtime",
          "packages/gleam_compiler",
          "packages/gleam_embed",
          "packages/gleam_hub",
          "packages/gleam_interpreter",
          "packages/gleam_ir",
          "packages/gleam_parser",
          "packages/gleam_playwright",
          "packages/gleam_sha256",
          "packages/gleam_vite",
          "packages/gleam_x",
          "packages/html_parser",
          "packages/intelligence",
          "packages/loam",
          "packages/morph",
          "packages/opencode_plugin",
          "packages/otel",
          "packages/overlay",
          "packages/overlay_eval",
          "packages/overlay_llm",
          "packages/overlay_public",
          "packages/overlay_puppet",
          "packages/overlay_web",
          "packages/pal",
          "packages/pi_extension",
          "packages/plinthx",
          "packages/topological",
          "packages/touch_grass",
          "packages/tracing",
          "packages/untethered",
          "packages/website",
          "examples/hashi",
          "examples/njs",
          "examples/todomvc_lustre",
          "examples/todomvc_native"
        ]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{matrix.bun}}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{matrix.node}}
      - name: Install JavaScript dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci
          elif [ -f package.json ]; then bun install --frozen-lockfile; fi
        working-directory: ${{matrix.path}}
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          gleam-version: ${{matrix.gleam}}
      - run: gleam deps download
        shell: bash # Required for git deps
        working-directory: ${{matrix.path}}
      - name: Manifest is in sync
        run: git diff --exit-code manifest.toml
        working-directory: ${{matrix.path}}
      - name: Build the standalone API for its native Todo consumer
        if: matrix.path == 'examples/todomvc_native'
        run: bun install --frozen-lockfile && gleam run -m build
        working-directory: packages/embed_js
      - name: Build SDK bundles before testing their consumers
        if: contains(fromJSON('["packages/embed_js", "packages/opencode_plugin", "packages/pi_extension"]'), matrix.path)
        run: gleam run -m build
        working-directory: ${{matrix.path}}
      - name: Build the CLI needed by Pi's shell adapter check
        if: matrix.path == 'packages/pi_extension'
        run: |
          gleam run -m compile
          echo "$GITHUB_WORKSPACE/packages/gleam_cli/dist" >> "$GITHUB_PATH"
        working-directory: packages/gleam_cli
      - run: gleam build --target javascript --warnings-as-errors
        working-directory: ${{matrix.path}}
      - run: if [ -d test ]; then gleam test --target javascript --runtime bun; fi
        working-directory: ${{matrix.path}}
      - run: gleam format --check src $(ls -d test dev 2>/dev/null)
        working-directory: ${{matrix.path}}
      - name: Compiled runtime is in sync
        if: matrix.path == 'packages/gleam_compiled_runtime'
        run: gleam run -m generate -- --check
        working-directory: ${{matrix.path}}
      - name: Run the pinned OpenCode dispatcher
        if: matrix.path == 'packages/opencode_plugin'
        run: gleam run -m upstream_check
        working-directory: ${{matrix.path}}
      - name: Test SDK bundles under Node
        if: contains(fromJSON('["packages/embed_js", "packages/opencode_plugin", "packages/pi_extension"]'), matrix.path)
        run: gleam test --runtime node
        working-directory: ${{matrix.path}}
      - name: Test the Pi game
        if: matrix.path == 'packages/eyg_pi'
        run: gleam run -- script ../eyg_pi/test/pong_test.eyg
        working-directory: packages/gleam_cli
  test-eyg-packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        gleam: ["1.19.2"]
        otp: ["28.4"]
        bun: ["1.3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{matrix.bun}}
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          gleam-version: ${{matrix.gleam}}
      # The packages use language features newer than the released CLI.
      - name: Build the eyg CLI from this checkout
        run: gleam run -m compile
        working-directory: packages/gleam_cli
      - name: Run EYG package tests
        run: packages/gleam_cli/dist/eyg script entry.eyg
      - name: Validate agent tasks without a model
        run: |
          gleam run -m overlay/eval -- validate suites/fibonacci.eyg
          gleam run -m overlay/eval -- validate suites/contexts.eyg
          gleam run -m overlay/eval -- validate suites/programs.eyg
        working-directory: packages/overlay_eval
  test-recording-tools:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        gleam: ["1.19.2"]
        otp: ["28.4"]
        bun: ["1.3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{matrix.bun}}
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          gleam-version: ${{matrix.gleam}}
      - name: Install browser library and Chromium
        run: bun install --frozen-lockfile && bunx playwright install --with-deps chromium
        working-directory: packages/tracing
      - name: Check offline performance viewer
        run: gleam run -- render && gleam run -m tracing/performance_demo
        working-directory: packages/tracing
        env:
          DEMO_OUTPUT_DIR: .recordings/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: packages/tracing/.recordings
  test-artifacts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        gleam: ["1.19.2"]
        otp: ["28.4"]
        bun: ["1.3.13"]
    services:
      postgres:
        image: postgres:17
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{matrix.bun}}
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          gleam-version: ${{matrix.gleam}}
      - name: Install browser and Overlay libraries
        run: |
          (cd packages/overlay_public && bun install --frozen-lockfile)
          (cd packages/tracing && bun install --frozen-lockfile && bunx playwright install --with-deps chromium)
      - name: Rebuild the preview and EYG viewer bundles
        run: gleam run --runtime bun -m bundle
        working-directory: packages/overlay_puppet
      - name: Check real previews, workspace recovery, sharing and browser controls
        run: gleam run -m tracing/artifact_check
        working-directory: packages/tracing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifact-browser-checks
          path: packages/tracing/.recordings
